name: Allonssy Daily Autopilot Growth Engine

on:
  schedule:
    # Runs daily at 09:00 UTC (10:00 AM Central European Time)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-growth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install pillow edge-tts requests python-dotenv

      - name: Run Daily Video Generator & Email Dispatcher
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OUTREACH_SENDER_EMAIL: "kashif@tradister-cloud.com"
        run: |
          python marketing/daily_email_dispatcher.py --force

      - name: Commit & Push New Video to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/videos/ docs/creator.html
          git commit -m "Auto-deploy daily marketing video asset" || echo "No changes to commit"
          git push
